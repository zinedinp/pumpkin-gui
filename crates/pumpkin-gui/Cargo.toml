[package]
name = "pumpkin-gui"
version.workspace = true
description = "Optional monitoring and console window for the Pumpkin server."
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "pumpkin-gui"
path = "src/bin/pumpkin-gui.rs"

[dependencies]
# `canvas` draws the tick graph, `svg` the row-action icons, `advanced` exposes the `Highlighter`
# trait the console colours its log with, and `tokio` backs `iced::time`.
iced = { version = "0.14.0", features = ["canvas", "svg", "advanced", "tokio"] }
pumpkin-gui-api.workspace = true
rfd = "0.17.2"
clap.workspace = true
tokio.workspace = true
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.5"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
postcard = "1.1"

[lints]
workspace = true
