[package]
name = "pumpkin-gui"
version.workspace = true
description = "Optional Qt6 monitoring and console window for the Pumpkin server."
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "pumpkin-gui"
path = "src/bin/pumpkin-gui.rs"

[dependencies]
cxx.workspace = true
cxx-qt.workspace = true
cxx-qt-lib = { workspace = true, features = ["qt_gui", "qt_qml"] }
pumpkin-gui-api.workspace = true
rfd = "0.17.2"
arc-swap.workspace = true
clap.workspace = true
tokio.workspace = true

[build-dependencies]
cxx-qt-build.workspace = true

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
postcard = "1.1"

[lints]
workspace = true

[package.metadata.cargo-machete]
# `cxx` is required by `#[cxx_qt::bridge]`'s macro expansion (the `include!`/`extern "C++"`
# glue), even though nothing here references `cxx::` directly.
ignored = ["cxx"]
